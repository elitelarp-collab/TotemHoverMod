name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip and Fix Folder Layout
        run: |
          if [ -f TotemHoverReady.zip ]; then
            unzip -o TotemHoverReady.zip -d .
            # If the zip created a subfolder, move everything out into the root
            if [ -d TotemHover ]; then
              mv TotemHover/* . 2>/dev/null || true
              mv TotemHover/.* . 2>/dev/null || true
            elif [ -d totemhovermod ]; then
              mv totemhovermod/* . 2>/dev/null || true
              mv totemhovermod/.* . 2>/dev/null || true
            elif [ -d TotemHoverMod ]; then
              mv TotemHoverMod/* . 2>/dev/null || true
              mv TotemHoverMod/.* . 2>/dev/null || true
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Build Command
        run: gradle build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod
          path: "**/build/libs/*.jar"
          
